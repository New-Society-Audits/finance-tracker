<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Tracker</title>
  <link rel="stylesheet" href="/static/dashboard.css" />
</head>
<body>
  <div class="app">

    <!-- ── Header ── -->
    <header class="header">
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="10" fill="#4f46e5"/>
          <path d="M10 15a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V15Z" stroke="#fff" stroke-width="1.5"/>
          <path d="M26 20a1 1 0 1 1 2 0 1 1 0 0 1-2 0Z" fill="#fff"/>
          <path d="M10 18h20" stroke="#fff" stroke-width="1.5"/>
        </svg>
        <span>Finance Tracker</span>
      </div>

      <div class="profile-wrap">
        <button class="profile-btn" id="profile-btn" aria-label="Profile menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="8" r="4" stroke="#555" stroke-width="1.5"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="dropdown" id="profile-dropdown">
          <span class="dropdown-user">{{ user }}</span>
          <a href="/logout" class="dropdown-item">Log out</a>
        </div>
      </div>
    </header>

    <!-- ── Main layout ── -->
    <main class="main">

      <!-- Left panel: expense list -->
      <aside class="left-panel">
        <div class="list-toolbar">
          <button class="filter-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 6h18M7 12h10M11 18h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Filter
          </button>
        </div>

        <ul class="expense-list">
          {% if not expenses %}
          <li class="empty-state">No expenses yet. Hit + to add one.</li>
          {% endif %}
          {% for expense in expenses %}
          <li class="expense-item">
            <details class="expense-details">
              <summary class="expense-summary">
                <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M9 6l6 6-6 6" stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="expense-name">{{ expense.name }}</span>
                <span class="expense-date">{{ expense.date }}</span>
              </summary>
              <div class="expense-body">
                <div class="expense-amount">${{ "%.2f"|format(expense.amount) }}</div>
                <div class="category-row">
                  <label class="category-label">Category</label>
                  <select class="category-select">
                    <option value="">— select —</option>
                    {% for cat in categories %}
                    <option value="{{ cat }}" {% if cat == expense.category %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                  </select>
                </div>
              </div>
            </details>
          </li>
          {% endfor %}
        </ul>
      </aside>

      <!-- Right panel: reserved for future charts -->
      <section class="right-panel">
        <span class="right-panel-hint">Charts coming soon</span>
      </section>

    </main>

    <!-- Floating "+" button -->
    <button class="add-btn" aria-label="Add expense">+</button>

  </div>

  <script>
    const profileBtn = document.getElementById('profile-btn');
    const profileDropdown = document.getElementById('profile-dropdown');
    profileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      profileDropdown.classList.toggle('open');
    });
    document.addEventListener('click', () => profileDropdown.classList.remove('open'));
  </script>
</body>
</html>
