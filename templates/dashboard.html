<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Tracker</title>
  <link rel="stylesheet" href="/static/dashboard.css" />
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <div class="app">

    <!-- ── Header: logo + profile dropdown with logout ── -->
    <header class="header">
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="10" fill="#4f46e5"/>
          <path d="M10 15a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V15Z" stroke="#fff" stroke-width="1.5"/>
          <path d="M26 20a1 1 0 1 1 2 0 1 1 0 0 1-2 0Z" fill="#fff"/>
          <path d="M10 18h20" stroke="#fff" stroke-width="1.5"/>
        </svg>
        <span>Finance Tracker</span>
      </div>

      <div class="profile-wrap">
        <button class="profile-btn" id="profile-btn" aria-label="Profile menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="8" r="4" stroke="#555" stroke-width="1.5"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="dropdown" id="profile-dropdown">
          <span class="dropdown-user">{{ user }}</span>
          <a href="/logout" class="dropdown-item">Log out</a>
        </div>
      </div>
    </header>

    <!-- ── Main layout: left panel (expenses) + right panel (charts) ── -->
    <main class="main">

      <!-- Left panel: filterable expense list loaded from the database -->
      <aside class="left-panel">
        <div class="list-toolbar">
          <div class="search-wrap">
            <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
              <path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <input type="text" id="search-input" class="search-input" placeholder="Search transactions…" oninput="filterBySearch()" />
          </div>
          <div class="filter-wrap">
            <button class="filter-btn" id="filter-btn" onclick="document.getElementById('filter-dropdown').classList.toggle('open')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 6h18M7 12h10M11 18h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <span id="filter-label">Filter</span>
            </button>
            <div class="filter-dropdown" id="filter-dropdown">
              <a class="filter-option active" href="#"
                 hx-get="/partials/expense-list" hx-target="#expense-list" hx-swap="innerHTML"
                 onclick="selectFilter(this, 'Filter')">All</a>
              {% for cat in categories %}
              <a class="filter-option" href="#"
                 hx-get="/partials/expense-list?category={{ cat }}" hx-target="#expense-list" hx-swap="innerHTML"
                 onclick="selectFilter(this, '{{ cat }}')">{{ cat }}</a>
              {% endfor %}
            </div>
          </div>
        </div>

        <ul class="expense-list" id="expense-list">
          {% include "partials/expense_list.html" %}
        </ul>
      </aside>

      <!-- Right panel: charts -->
      <section class="right-panel">
        <div class="chart-mode-toggle">
          <button class="chart-mode-btn active" data-mode="expenses" onclick="setChartMode(this)">Expenses</button>
          <button class="chart-mode-btn" data-mode="income" onclick="setChartMode(this)">Income</button>
        </div>
        <div class="chart-controls">
          <div class="control-row">
            <label class="control-label">From</label>
            <input type="date" id="date-from" class="control-input" oninput="updateCharts()" onchange="updateCharts()" />
            <label class="control-label">To</label>
            <input type="date" id="date-to" class="control-input" oninput="updateCharts()" onchange="updateCharts()" />
          </div>
          <div class="control-row">
            <div class="filter-wrap">
              <button class="filter-btn" id="chart-filter-btn" onclick="document.getElementById('chart-filter-dropdown').classList.toggle('open')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M3 6h18M7 12h10M11 18h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span id="chart-filter-label">All categories</span>
              </button>
              <div class="filter-dropdown" id="chart-filter-dropdown">
                <a class="filter-option active" href="#" data-cat=""
                   onclick="selectChartFilter(this, '')">All categories</a>
              </div>
            </div>
          </div>
          <div class="control-row">
            <div class="timeframe-toggle">
              <button class="timeframe-btn active" data-tf="daily" onclick="setTimeframe(this)">Daily</button>
              <button class="timeframe-btn" data-tf="weekly" onclick="setTimeframe(this)">Weekly</button>
              <button class="timeframe-btn" data-tf="monthly" onclick="setTimeframe(this)">Monthly</button>
            </div>
          </div>
        </div>
        <div class="chart-container">
          <h3 class="chart-title" id="spending-title">Daily Spending</h3>
          <canvas id="spending-chart"></canvas>
        </div>
        <div class="chart-container chart-container--doughnut">
          <h3 class="chart-title">By Category</h3>
          <div class="doughnut-wrap">
            <canvas id="category-chart"></canvas>
          </div>
        </div>
      </section>

    </main>

    <!-- Floating "+" button — loads the add-expense modal via HTMX -->
    <button class="add-btn" aria-label="Add expense"
            hx-get="/modal/add-expense" hx-target="#modal-container" hx-swap="innerHTML">+</button>

    <!-- Empty container where HTMX injects the add-expense modal HTML -->
    <div id="modal-container"></div>

  </div>

  <script>
    // ── Profile dropdown toggle ──
    const profileBtn = document.getElementById('profile-btn');
    const profileDropdown = document.getElementById('profile-dropdown');
    profileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      profileDropdown.classList.toggle('open');
    });

    // Close any open dropdown when clicking outside
    document.addEventListener('click', () => {
      profileDropdown.classList.remove('open');
      document.getElementById('filter-dropdown').classList.remove('open');
      document.getElementById('chart-filter-dropdown').classList.remove('open');
    });
    document.getElementById('filter-btn').addEventListener('click', (e) => e.stopPropagation());
    document.getElementById('chart-filter-btn').addEventListener('click', (e) => e.stopPropagation());

    // Check overflow on all filter dropdowns to show scroll fade
    function checkDropdownOverflow(dd) {
      dd.classList.toggle('has-overflow', dd.scrollHeight > dd.clientHeight && dd.scrollTop + dd.clientHeight < dd.scrollHeight - 4);
    }
    document.querySelectorAll('.filter-dropdown').forEach(dd => {
      dd.addEventListener('scroll', () => checkDropdownOverflow(dd));
      new MutationObserver(() => {
        if (dd.classList.contains('open')) requestAnimationFrame(() => checkDropdownOverflow(dd));
      }).observe(dd, { attributes: true, attributeFilter: ['class'], childList: true });
    });

    // ── Category filter selection ──
    // Updates the active filter label and closes the dropdown;
    // the actual filtering is handled by HTMX (hx-get on each option).
    function selectFilter(el, label) {
      document.querySelectorAll('#filter-dropdown .filter-option').forEach(o => o.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('filter-label').textContent = label;
      document.getElementById('filter-dropdown').classList.remove('open');
    }

    function filterBySearch() {
      const q = document.getElementById('search-input').value.toLowerCase();
      document.querySelectorAll('#expense-list .expense-item').forEach(li => {
        const name = li.querySelector('.expense-name');
        const text = name ? name.textContent.toLowerCase() : '';
        li.style.display = text.includes(q) ? '' : 'none';
      });
    }

    function confirmDelete(btn, id) {
      if (btn.dataset.confirm) {
        htmx.ajax('DELETE', '/expense/' + id, {target: btn.closest('.expense-item'), swap: 'outerHTML'});
        // Optimistic local update: strip from the chart dataset immediately
        // rather than waiting for htmx:afterSwap (which doesn't fire reliably
        // when outerHTML swap removes the target element itself).
        const idx = allExpenses.findIndex(ex => ex.id === id);
        if (idx !== -1) allExpenses.splice(idx, 1);
        updateCategoryDropdown();
        updateCharts();
        return;
      }
      btn.dataset.confirm = '1';
      btn.textContent = 'Confirm?';
      btn.classList.add('delete-confirm');
      setTimeout(() => {
        if (btn.isConnected) {
          delete btn.dataset.confirm;
          btn.textContent = 'Delete';
          btn.classList.remove('delete-confirm');
        }
      }, 3000);
    }

    // ── Exclude from chart ──
    const EXCLUDED_KEY = 'excludedFromChart';
    let excludedIds = new Set(JSON.parse(localStorage.getItem(EXCLUDED_KEY) || '[]'));

    function saveExcluded() {
      localStorage.setItem(EXCLUDED_KEY, JSON.stringify([...excludedIds]));
    }

    function applyExcludedState() {
      excludedIds.forEach(id => {
        const li = document.getElementById('expense-' + id);
        if (li) li.classList.add('excluded');
        const btn = document.getElementById('exclude-btn-' + id);
        if (btn) btn.textContent = 'Include in chart';
      });
    }
    applyExcludedState();

    // Re-apply excluded styling after HTMX swaps (e.g. filter changes)
    document.body.addEventListener('htmx:afterSettle', function(e) {
      if (e.detail.target && e.detail.target.id === 'expense-list') {
        applyExcludedState();
        filterBySearch();
      }
    });

    // Update charts after delete or category change
    document.body.addEventListener('htmx:afterSwap', function(e) {
      const verb = e.detail.requestConfig && e.detail.requestConfig.verb;
      if (verb === 'put') {
        const path = e.detail.requestConfig.path || '';
        const match = path.match(/\/expense\/(\d+)\/category/);
        if (match) {
          const id = parseInt(match[1]);
          const tag = document.getElementById('category-tag-' + id);
          const catName = (tag && tag.textContent.trim()) || null;
          const exp = allExpenses.find(ex => ex.id === id);
          if (exp) exp.category = catName;
          const li = document.getElementById('expense-' + id);
          if (li) li.classList.toggle('uncategorized', !catName);
        }
        updateCharts();
      }
    });

    function toggleExclude(id) {
      const li = document.getElementById('expense-' + id);
      if (excludedIds.has(id)) {
        excludedIds.delete(id);
        if (li) li.classList.remove('excluded');
      } else {
        excludedIds.add(id);
        if (li) li.classList.add('excluded');
      }
      saveExcluded();
      updateCharts();
      // Update button text
      const btn = document.getElementById('exclude-btn-' + id);
      if (btn) btn.textContent = excludedIds.has(id) ? 'Include in chart' : 'Exclude from chart';
    }

    // ── Charts ──
    Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    // Only keep entries with a valid ISO date — a null/malformed date would
    // otherwise poison the fillGaps loop and spin until the browser hangs.
    const allExpenses = {{ expenses | tojson }}.filter(e => typeof e.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date));
    const categoryColorMap = {
      'Food': '#ef4444',
      'Transport': '#06b6d4',
      'Shopping': '#f59e0b',
      'Entertainment': '#ec4899',
      'Health': '#10b981',
      'Utilities': '#7c3aed',
      'Investment': '#3b82f6',
      'Taxes': '#f97316',
      'Work': '#84cc16',
      'Salary': '#3b82f6',
      'Refund': '#f59e0b',
      'Other Income': '#10b981',
      'Other': '#6b7280',
      'Uncategorized': '#d1d5db',
    };
    const fallbackColors = ['#a855f7','#14b8a6','#e11d48','#84cc16','#f43f5e','#22d3ee'];
    function getCatColor(name) {
      if (categoryColorMap[name]) return categoryColorMap[name];
      // Stable fallback: hash the name to pick a consistent color
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return fallbackColors[Math.abs(hash) % fallbackColors.length];
    }
    let timeframe = 'daily';
    let chartMode = 'expenses';
    let spendingChart, categoryChart;

    // Set default date range from data
    const allDates = allExpenses.map(e => e.date).filter(Boolean).sort();
    if (allDates.length) {
      document.getElementById('date-from').value = allDates[0];
      document.getElementById('date-to').value = allDates[allDates.length - 1];
    }

    let chartCategoryFilter = '';

    function selectChartFilter(el, cat) {
      document.querySelectorAll('#chart-filter-dropdown .filter-option').forEach(o => o.classList.remove('active'));
      el.classList.add('active');
      chartCategoryFilter = cat;
      document.getElementById('chart-filter-label').textContent = cat || 'All categories';
      document.getElementById('chart-filter-dropdown').classList.remove('open');
      updateCharts();
    }

    function updateCategoryDropdown() {
      const dropdown = document.getElementById('chart-filter-dropdown');
      const relevantCats = new Set();
      allExpenses.forEach(e => {
        if (chartMode === 'expenses' && e.amount >= 0) return;
        if (chartMode === 'income' && e.amount <= 0) return;
        relevantCats.add(e.category || 'Uncategorized');
      });
      const sorted = [...relevantCats].sort();
      if (!relevantCats.has(chartCategoryFilter)) {
        chartCategoryFilter = '';
        document.getElementById('chart-filter-label').textContent = 'All categories';
      }
      dropdown.innerHTML = '<a class="filter-option' + (chartCategoryFilter === '' ? ' active' : '') + '" href="#" data-cat="" onclick="selectChartFilter(this, \'\')">All categories</a>' +
        sorted.map(c => '<a class="filter-option' + (c === chartCategoryFilter ? ' active' : '') + '" href="#" data-cat="' + c + '" onclick="selectChartFilter(this, \'' + c + '\')">' + c + '</a>').join('');
    }

    function setChartMode(btn) {
      document.querySelectorAll('.chart-mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      chartMode = btn.dataset.mode;
      const tfTitles = {
        daily: chartMode === 'income' ? 'Daily Income' : 'Daily Spending',
        weekly: chartMode === 'income' ? 'Weekly Income' : 'Weekly Spending',
        monthly: chartMode === 'income' ? 'Monthly Income' : 'Monthly Spending',
      };
      document.getElementById('spending-title').textContent = tfTitles[timeframe];
      updateCategoryDropdown();
      updateCharts();
    }

    function getFiltered() {
      const from = document.getElementById('date-from').value;
      const to = document.getElementById('date-to').value;
      const cat = chartCategoryFilter;
      return allExpenses.filter(e => {
        if (excludedIds.has(e.id)) return false;
        if (chartMode === 'expenses' && e.amount >= 0) return false;
        if (chartMode === 'income' && e.amount <= 0) return false;
        if (from && e.date < from) return false;
        if (to && e.date > to) return false;
        if (cat && (e.category || 'Uncategorized') !== cat) return false;
        return true;
      });
    }

    function getWeekKey(dateStr) {
      const d = new Date(dateStr);
      const day = d.getDay() || 7;
      d.setDate(d.getDate() - day + 1);
      return d.toISOString().slice(0, 10);
    }

    function formatLabel(key, tf) {
      if (tf === 'monthly') return key.slice(5, 7) + '/' + key.slice(0, 4);
      return key.slice(8) + '/' + key.slice(5, 7);
    }

    function addDays(dateStr, n) {
      const d = new Date(dateStr);
      d.setDate(d.getDate() + n);
      return d.toISOString().slice(0, 10);
    }

    function addMonths(dateStr, n) {
      const d = new Date(dateStr + '-01');
      d.setMonth(d.getMonth() + n);
      return d.toISOString().slice(0, 7);
    }

    function fillGaps(map) {
      const keys = Object.keys(map).sort();
      if (keys.length < 2) return keys;
      const filled = [];
      const end = keys[keys.length - 1];
      const step = timeframe === 'weekly' ? (s => addDays(s, 7))
                 : timeframe === 'monthly' ? (s => addMonths(s, 1))
                 : (s => addDays(s, 1));
      let cur = keys[0];
      // Hard cap at 10 years of daily entries — guards against a runaway loop
      // if `cur` ever fails to advance past `end` (bad input, stringly-sorted keys).
      for (let i = 0; i < 4000 && cur <= end; i++) {
        filled.push(cur);
        if (!(cur in map)) map[cur] = 0;
        const next = step(cur);
        if (next <= cur) break;
        cur = next;
      }
      return filled;
    }

    function aggregate(filtered) {
      const map = {};
      filtered.forEach(e => {
        let key;
        if (timeframe === 'daily') key = e.date;
        else if (timeframe === 'weekly') key = getWeekKey(e.date);
        else key = e.date.slice(0, 7);
        map[key] = (map[key] || 0) + Math.abs(e.amount);
      });
      const keys = fillGaps(map);
      return { labels: keys.map(k => formatLabel(k, timeframe)), data: keys.map(k => map[k]), keys };
    }

    function rangeForKey(key, tf) {
      if (tf === 'monthly') {
        const end = new Date(key + '-01');
        end.setMonth(end.getMonth() + 1);
        end.setDate(0);
        return { start: key + '-01', end: end.toISOString().slice(0, 10) };
      }
      if (tf === 'weekly') return { start: key, end: addDays(key, 6) };
      return { start: key, end: key };
    }

    function highlightForKey(key, tf) {
      const { start, end } = rangeForKey(key, tf);
      document.querySelectorAll('.expense-item.highlighted').forEach(el => el.classList.remove('highlighted'));

      const matches = allExpenses
        .filter(e => e.date >= start && e.date <= end)
        .map(e => document.getElementById('expense-' + e.id))
        .filter(el => el && el.offsetParent !== null);

      if (matches.length) {
        matches[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
        matches.forEach(el => el.classList.add('highlighted'));
        setTimeout(() => matches.forEach(el => el.classList.remove('highlighted')), 2500);
        return;
      }

      // Empty day — scroll to the nearest visible expense by date, no highlight.
      const target = new Date(start).getTime();
      let best = null, bestDiff = Infinity;
      allExpenses.forEach(e => {
        const li = document.getElementById('expense-' + e.id);
        if (!li || li.offsetParent === null) return;
        const diff = Math.abs(new Date(e.date).getTime() - target);
        if (diff < bestDiff) { bestDiff = diff; best = li; }
      });
      if (best) best.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function setTimeframe(btn) {
      document.querySelectorAll('.timeframe-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      timeframe = btn.dataset.tf;
      const label = chartMode === 'income' ? 'Income' : 'Spending';
      const titles = { daily: 'Daily ' + label, weekly: 'Weekly ' + label, monthly: 'Monthly ' + label };
      document.getElementById('spending-title').textContent = titles[timeframe];
      updateCharts();
    }

    function updateCharts() {
      const filtered = getFiltered();
      const { labels, data, keys } = aggregate(filtered);
      const clickedTf = timeframe;

      if (spendingChart) spendingChart.destroy();
      spendingChart = new Chart(document.getElementById('spending-chart'), {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: chartMode === 'income' ? 'Income (Kč)' : 'Spent (Kč)',
            data,
            borderColor: chartMode === 'income' ? '#10b981' : '#4f46e5',
            backgroundColor: chartMode === 'income' ? 'rgba(16, 185, 129, 0.1)' : 'rgba(79, 70, 229, 0.1)',
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointBackgroundColor: chartMode === 'income' ? '#10b981' : '#4f46e5',
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { bottom: 8 } },
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { callback: v => v.toLocaleString('cs-CZ') + ' Kč', font: { size: 11 } } },
            x: { ticks: { maxRotation: 45, font: { size: 11 } } }
          },
          onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
          onClick: (e) => {
            const pts = spendingChart.getElementsAtEventForMode(e, 'index', { intersect: false }, true);
            if (!pts.length) return;
            const key = keys[pts[0].index];
            if (key) highlightForKey(key, clickedTf);
          }
        }
      });

      const catMap = {};
      filtered.forEach(e => {
        const cat = e.category || 'Uncategorized';
        catMap[cat] = (catMap[cat] || 0) + Math.abs(e.amount);
      });
      const catLabels = Object.keys(catMap).sort((a, b) => catMap[b] - catMap[a]);
      const catData = catLabels.map(c => catMap[c]);

      if (categoryChart) categoryChart.destroy();
      categoryChart = new Chart(document.getElementById('category-chart'), {
        type: 'doughnut',
        data: {
          labels: catLabels,
          datasets: [{
            data: catData,
            backgroundColor: catLabels.map(c => getCatColor(c)),
            borderWidth: 0,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: { position: 'left', labels: { padding: 10, boxWidth: 12, font: { size: 11 } } },
            tooltip: { callbacks: { label: ctx => ctx.label + ': ' + ctx.parsed.toFixed(2) + ' Kč' } }
          }
        }
      });
    }

    updateCategoryDropdown();
    updateCharts();
  </script>
</body>
</html>
