<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Tracker — Login</title>
  <link rel="stylesheet" href="/static/login.css" />
</head>
<body>
  <div class="card">
    <div class="logo">
      <!-- simple wallet icon -->
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="10" fill="#4f46e5"/>
        <path d="M10 15a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V15Z" stroke="#fff" stroke-width="1.5"/>
        <path d="M26 20a1 1 0 1 1 2 0 1 1 0 0 1-2 0Z" fill="#fff"/>
        <path d="M10 18h20" stroke="#fff" stroke-width="1.5"/>
      </svg>
      <h1>Finance Tracker</h1>
      <p>Sign in to your account</p>
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
