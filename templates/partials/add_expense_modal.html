<!--
  Add Expense modal — loaded via HTMX into #modal-container.
  Provides two upload modes (Receipt image / CSV bank statement)
  toggled by the tab buttons at the top.
  Each form submits via HTMX POST; the server returns a success/error
  snippet that replaces #modal-body-content.
-->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this){this.remove()}">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title">Add Expense</h2>
      <button class="modal-close" onclick="document.getElementById('modal-overlay').remove()">&times;</button>
    </div>

    <div class="modal-body">
      <!-- Toggle between receipt image and bank statement upload -->
      <div class="upload-toggle">
        <button class="toggle-btn active" id="toggle-receipt" onclick="switchTab('receipt')">Receipt</button>
        <button class="toggle-btn" id="toggle-statement" onclick="switchTab('statement')">Bank Statement</button>
      </div>

      <!-- Receipt upload -->
      <div class="upload-section" id="tab-receipt">
        <form id="receipt-form" hx-post="/upload/receipt" hx-target="#modal-body-content" hx-swap="innerHTML"
              hx-encoding="multipart/form-data">
          <div class="drop-zone" id="drop-zone-receipt">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 16V4m0 0l-4 4m4-4l4 4" stroke="#aaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17" stroke="#aaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <p class="drop-text">Drag and drop receipt image here</p>
            <p class="drop-subtext">or</p>
            <label class="file-label">
              Browse files
              <input type="file" name="file" accept="image/*" hidden onchange="fileSelected(this, 'receipt')" />
            </label>
            <p class="file-name" id="file-name-receipt"></p>
          </div>
          <button type="submit" class="upload-submit" id="submit-receipt" disabled>Upload & Process</button>
        </form>
      </div>

      <!-- Bank statement upload -->
      <div class="upload-section hidden" id="tab-statement">
        <form id="statement-form" hx-post="/upload/statement" hx-target="#modal-body-content" hx-swap="innerHTML"
              hx-encoding="multipart/form-data">
          <div class="drop-zone" id="drop-zone-statement">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 16V4m0 0l-4 4m4-4l4 4" stroke="#aaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17" stroke="#aaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <p class="drop-text">Drag and drop bank statement CSV here</p>
            <p class="drop-subtext">or</p>
            <label class="file-label">
              Browse files
              <input type="file" name="file" accept=".csv,text/csv" hidden onchange="fileSelected(this, 'statement')" />
            </label>
            <p class="file-name" id="file-name-statement"></p>
          </div>
          <button type="submit" class="upload-submit" id="submit-statement" disabled>Upload & Process</button>
        </form>
      </div>

      <div id="modal-body-content"></div>
    </div>
  </div>
</div>

<script>
// Toggle visibility between receipt and statement upload forms
function switchTab(tab) {
  document.getElementById('tab-receipt').classList.toggle('hidden', tab !== 'receipt');
  document.getElementById('tab-statement').classList.toggle('hidden', tab !== 'statement');
  document.getElementById('toggle-receipt').classList.toggle('active', tab === 'receipt');
  document.getElementById('toggle-statement').classList.toggle('active', tab === 'statement');
}

// Show selected filename and enable the submit button
function fileSelected(input, type) {
  const nameEl = document.getElementById('file-name-' + type);
  const submitBtn = document.getElementById('submit-' + type);
  if (input.files.length > 0) {
    nameEl.textContent = input.files[0].name;
    submitBtn.disabled = false;
  }
}

// Set up drag-and-drop handlers for both upload zones
['receipt', 'statement'].forEach(type => {
  const zone = document.getElementById('drop-zone-' + type);
  const form = document.getElementById(type + '-form');
  ['dragenter','dragover'].forEach(e => zone.addEventListener(e, ev => { ev.preventDefault(); zone.classList.add('drag-over'); }));
  ['dragleave','drop'].forEach(e => zone.addEventListener(e, ev => { ev.preventDefault(); zone.classList.remove('drag-over'); }));
  zone.addEventListener('drop', ev => {
    const fileInput = form.querySelector('input[type="file"]');
    fileInput.files = ev.dataTransfer.files;
    fileSelected(fileInput, type);
  });
});
</script>
